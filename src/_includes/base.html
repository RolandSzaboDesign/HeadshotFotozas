<!DOCTYPE html>
<html lang="{{ site.lang }}">
	<head>
		<meta charset="utf-8">
		<title>{% if page.url == "/" %}{{ site.seo_title }}{% else %}{{ title }} | {{ site.title }}{% endif %}</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="{{ site.description_short }}">
		<meta name="author" content="{{ site.author.name }}">
		<meta name="robots" content="{{ robots | default: 'max-image-preview:large' }}">
		<link rel="canonical" href="{{ site.url }}{{ page.url }}">

		<!-- Webfont Preload -->
		<link rel="preload" href="{{ '/assets/webfonts/commissioner-v24-latin-ext-300.woff2' | assetUrl }}" as="font" type="font/woff2" crossorigin>
		<link rel="preload" href="{{ '/assets/webfonts/commissioner-v24-latin-ext-700.woff2' | assetUrl }}" as="font" type="font/woff2" crossorigin>
		<link rel="preload" href="{{ '/assets/webfonts/commissioner-v24-latin-ext-800.woff2' | assetUrl }}" as="font" type="font/woff2" crossorigin>

		<!-- Styles -->
		<link rel="stylesheet" href="{{ '/assets/css/style.css' | assetUrl }}">
        <link rel="stylesheet" href="{{ '/assets/css/landing.css' | assetUrl }}">
		<link rel="stylesheet" href="{{ '/assets/css/measurement.css' | assetUrl }}">

		<!-- Scripts -->
		<script src="{{ '/assets/js/main.js' | assetUrl }}" defer></script>
		<script src="{{ '/assets/js/measurement.js' | assetUrl }}" defer></script>

		<!-- Favicons -->
		<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/favicons/apple-touch-icon.png' | assetUrl }}">
		<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicons/favicon-32x32.png' | assetUrl }}">
		<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicons/favicon-16x16.png' | assetUrl }}">
		<link rel="manifest" href="{{ '/assets/favicons/site.webmanifest' | assetUrl }}">
		<link rel="mask-icon" href="{{ '/assets/favicons/safari-pinned-tab.svg' | assetUrl }}" color="#5bbad5">
		<link rel="shortcut icon" href="{{ '/assets/favicons/favicon.ico' | assetUrl }}">
		<meta name="msapplication-TileColor" content="#da532c">
		<meta name="msapplication-config" content="/assets/favicons/browserconfig.xml">
		<meta name="theme-color" content="#ffffff">

		<!-- OpenGraph -->
		<meta property="og:type" content="website">
		<meta property="og:site_name" content="{{ site.title }}">
		<meta property="og:url" content="{{ site.url }}{{ page.url }}">
		<meta property="og:locale" content="{{ site.locale }}">
		<meta property="og:title" content="{{ site.seo_title }}">
		<meta property="og:description" content="{{ site.description_long }}">
		<meta property="og:image" content="https://headshotfotozas.hu/assets/images/og_image.webp">

		<!-- Twitter/X Card -->
		<meta name="twitter:card" content="summary_large_image">
		<meta name="twitter:site" content="@szabokaphoto">
		<meta name="twitter:creator" content="@szabokaphoto">
		<meta name="twitter:title" content="{{ site.seo_title }}">
		<meta name="twitter:description" content="{{ site.description_long }}">
		<meta name="twitter:image" content="https://headshotfotozas.hu/assets/images/og_image.webp">
		<meta name="twitter:image:alt" content="{{ site.title }} | {{ site.tagline }}">

		<!-- Ahrefs Analytics -->
		<script src="https://analytics.ahrefs.com/analytics.js" data-key="KTz0cQwhePdNexGAiESruA" async></script>
	</head>

	<body>
		{{ content }}
		{% include "partials/footer.html" %}
		{% include "partials/privacy-policy.html" %}
		{% include "partials/consent.html" %}
	</body>
</html>
